[project]
name = "at-python-template"
version = "1.3.1"
description = "This is the official Python Project Template of Alexander Thamm GmbH (AT)"
authors = [
    { name = "Christian Baur", email = "christian.baur@alexanderthamm.com" },
    { name = "Honza Bílek", email = "jan.bilek@alexanderthamm.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "cookiecutter>=2.6,<3",
    "pre-commit>=4.5.1,<5",
    "pytest-mock>=3.15.1,<4",
    "pyhocon>=0.3.61,<0.4",
    "pyyaml>=6.0.3,<7",
    "typer>=0.25.0",
    "setuptools>=82.0.0",
    "requests>=2.32.5",
    "urllib3>=2.6.3",
    "wheel~=0.46.3",
    "filelock>=3.20.3",
    "virtualenv>=20.36.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.ruff]
exclude = ["{{cookiecutter.project_slug}}", "serve"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
