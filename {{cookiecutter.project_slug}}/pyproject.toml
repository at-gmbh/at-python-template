{% if cookiecutter.package_manager == "poetry" -%}
[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = ["{{ cookiecutter.full_name }} <{{ cookiecutter.email }}>"]
license = "proprietary"
packages = [{ include = "{{ cookiecutter.module_name }}", from = "src" }]
include = ["src/{{ cookiecutter.module_name }}/res/*"]

[tool.poetry.dependencies]
python = "^3.10"
{%- if cookiecutter.config_file == 'hocon' %}
pyhocon = "^0.3.61"
{%- elif cookiecutter.config_file == 'yaml' %}
PyYAML = "^6.0.3"
{%- endif %}
{%- if cookiecutter.create_cli == 'yes' %}
typer = "^0.21.1"
{%- endif %}
{%- if cookiecutter.include_ai_starter_kit == 'yes' %}
langchain = "^0.3"
langchain-openai = "^0.2"
langchain-community = "^0.3"
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"
loguru = "^0.7"
chromadb = "^0.6"
tiktoken = "^0.8"
{%- endif %}
{%- if cookiecutter.ui_framework == 'chainlit' %}
chainlit = "^1.3"
{%- elif cookiecutter.ui_framework == 'streamlit' %}
streamlit = "^1.40"
{%- endif %}

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.poetry.group.linter.dependencies]
{%- if cookiecutter.code_formatter == 'black' %}
black = "^25.1.0"
isort = "^5.12.0"
{%- elif cookiecutter.code_formatter == 'ruff' %}
ruff = "^0.12.2"
{%- endif %}

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"{% if cookiecutter.use_notebooks == 'yes' %}
jupyterlab = "^4.5.3"{% endif %}

[tool.poetry.extras]
build = ["setuptools", "cython"]

[tool.poetry.scripts]
{%- if cookiecutter.create_cli == "yes" %}
{{ cookiecutter.project_slug }} = "{{ cookiecutter.module_name }}.main:app"
{%- endif %}

{%- if cookiecutter.code_formatter == 'ruff' %}

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["__init__.py"]
extend-exclude = ["notebooks/*"]

[tool.ruff.lint]
select = [
    "E",  # Pycodestyle errors
    "F",  # Pyflakes errors
    "UP", # pyupgrade checks
    "B",  # Bugbear checks
    "SIM",# Simplification checks
    "I",  # Import order checks (isort)
    "N"   # Naming convention checks
]
task-tags = ["TODO", "FIXME", "NOTE"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.module_name }}"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
{%- endif %}

{%- if cookiecutter.code_formatter != 'ruff' %}

[tool.isort]{% if cookiecutter.code_formatter == 'black' %}
profile = "black"{% else %}
py_version = 310
line_length = 100
multi_line_output = 3{% endif %}
{%- endif %}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "test", "linter"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

{%- else %}[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = [{ name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" }]
requires-python = ">=3.9"
dependencies = [
{%- if cookiecutter.config_file == 'hocon' %}
"pyhocon>=0.3.59",
{%- elif cookiecutter.config_file == 'yaml' %}
"PyYAML>=6.0",
{%- endif %}
{%- if cookiecutter.create_cli == 'yes' %}
"typer>=0.16.1",
{%- endif %}
{%- if cookiecutter.include_ai_starter_kit == 'yes' %}
"langchain>=0.3",
"langchain-openai>=0.2",
"langchain-community>=0.3",
"pydantic>=2.10",
"pydantic-settings>=2.7",
"python-dotenv>=1.0",
"loguru>=0.7",
"chromadb>=0.6",
"tiktoken>=0.8",
{%- endif %}
{%- if cookiecutter.ui_framework == 'chainlit' %}
"chainlit>=1.3",
{%- elif cookiecutter.ui_framework == 'streamlit' %}
"streamlit>=1.40",
{%- endif %}
]

[project.license]
text = "proprietary"

[project.optional-dependencies]
build = ["setuptools", "cython"]

{%- if cookiecutter.create_cli == "yes" %}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.module_name }}.main:app"
{%- endif %}

[project.gui-scripts]
hello_gui = "{{ cookiecutter.module_name }}.gui:main"

[project.entry-points."example.plugins"]
a = "{{ cookiecutter.module_name }}_plugin_a"

[dependency-groups]
dev = ["pre-commit>=4.3.0"{% if cookiecutter.use_notebooks == 'yes' %}, "jupyterlab>=4.5.3"{% endif %}]
linter = [
{%- if cookiecutter.code_formatter == 'black' %}
"black>=25.1.0",
"isort>=5.12.0"
{%- elif cookiecutter.code_formatter == 'ruff' %}
"ruff>=0.12.2"
{%- endif %}
]
test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]

{%- if cookiecutter.code_formatter == 'ruff' %}

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["__init__.py"]
extend-exclude = ["notebooks/*"]

[tool.ruff.lint]
select = [
    "E",  # Pycodestyle errors
    "F",  # Pyflakes errors
    "UP", # pyupgrade checks
    "B",  # Bugbear checks
    "SIM",# Simplification checks
    "I",  # Import order checks (isort)
    "N"   # Naming convention checks
]
task-tags = ["TODO", "FIXME", "NOTE"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.module_name }}"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
{%- endif %}

{%- if cookiecutter.code_formatter != 'ruff' %}

[tool.isort]
{%- if cookiecutter.code_formatter == 'black' %}
profile = "black"
{%- else %}
line_length = 100
multi_line_output = 3
{%- endif %}
{%- endif %}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "test", "linter"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
{%- endif %}
