{% if cookiecutter.package_manager == "poetry" -%}
[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = ["{{ cookiecutter.full_name }} <{{ cookiecutter.email }}>"]
license = "proprietary"
packages = [{ include = "{{ cookiecutter.module_name }}", from = "src" }]
include = ["src/{{ cookiecutter.module_name }}/res/*"]

[tool.poetry.dependencies]
python = "^3.9"
{%- if cookiecutter.config_file == 'hocon' %}
pyhocon = "^0.3.59"
{%- elif cookiecutter.config_file == 'yaml' %}
PyYAML = "^6.0"
{%- endif %}
{%- if cookiecutter.create_cli == 'yes' %}
typer = "^0.15.1"
{{ cookiecutter.project_slug }} = "{{ cookiecutter.module_name }}.main:app"
{%- endif %}

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"

[tool.poetry.group.linter.dependencies]
{%- if cookiecutter.code_formatter == 'black' %}
black = "^25.1.0"
{%- else %}
ruff = "^0.12.2"
{%- endif %}
isort = "^5.12.0"

[tool.poetry.extras]
build = ["setuptools", "cython"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"{% if cookiecutter.use_notebooks == 'yes' %}
jupyterlab = "^4.3.5"{% endif %}
{% if cookiecutter.code_formatter != 'black' %}
[tool.ruff]
line-length = 100
src = ["src", "tests"]
ignore = ["F401"]
target-version = "py39"
exclude = ["__init__.py"]
extend-exclude = ["notebooks/*"]

[tool.ruff.lint]
select = [
    "E",  # Pycodestyle errors
    "F",  # Pyflakes errors
    "UP", # pyupgrade checks
    "B",  # Bugbear checks
    "SIM",# Simplifcation checks
    "I",  # Import order checks (isort)
    "N"   # Naming convention checks
]
task-tags = ["TODO", "FIXME", "NOTE"]
{% endif %}
[tool.isort]{% if cookiecutter.code_formatter == 'black' %}
profile = "black"{% else %}
py_version = 310
line_length = 100
multi_line_output = 3{% endif %}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
default-groups = ["dev", "test", "linter"]

{%- else %}[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = [{ name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" }]
requires-python = ">=3.9"
dependencies = [
{%- if cookiecutter.config_file == 'hocon' %}
"pyhocon>=0.3.59",
{%- elif cookiecutter.config_file == 'yaml' %}
"PyYAML>=6.0",
{%- endif %}
{%- if cookiecutter.create_cli == 'yes' %}
"typer>=0.15.1",
{%- endif %}
]

[project.license]
text = "proprietary"

[project.optional-dependencies]
build = ["setuptools", "cython"]

{%- if cookiecutter.create_cli == "yes" %}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.module_name }}.main:app"
{%- endif %}

[project.gui-scripts]
hello_gui = "{{ cookiecutter.module_name }}.gui:main"

[project.entry-points."example.plugins"]
a = "{{ cookiecutter.module_name }}_plugin_a"

[dependency-groups]
dev = ["pre-commit>=3.0"{% if cookiecutter.use_notebooks == 'yes' %}, "jupyterlab>=3.5"{% endif %}]
linter = [
{%- if cookiecutter.code_formatter == 'black' %}
"black>=25.1.0",
{%- else %}
"ruff>=0.12.2",
{%- endif %}
"isort>=5.12.0"
]
test = ["pytest>=8.3.4", "pytest-cov>=6.0"]

[tool.isort]
{%- if cookiecutter.code_formatter == 'black' %}
profile = "black"
{%- else %}
line_length = 100
multi_line_output = 3
{%- endif %}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "test", "linter"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
{%- endif %}
