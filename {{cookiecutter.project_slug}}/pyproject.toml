{% if cookiecutter.package_manager == "poetry" -%}
[tool.poetry]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = ["{{ cookiecutter.full_name }} <{{ cookiecutter.email }}>"]
license = "proprietary"
packages = [{ include = "{{ cookiecutter.module_name }}", from = "src" }]
include = ["src/{{ cookiecutter.module_name }}/res/*"]

[tool.poetry.dependencies]
python = "^3.10"
{%- if cookiecutter.config_file == 'hocon' %}
pyhocon = "^0.3.61"
{%- elif cookiecutter.config_file == 'yaml' %}
omegaconf = "^2.3.0"
{%- endif %}
{%- if cookiecutter.create_cli == 'yes' %}
typer = "^0.21.1"
{%- endif %}

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.poetry.group.linter.dependencies]
{%- if cookiecutter.code_formatter == 'black' %}
black = "^25.1.0"
{%- else %}
ruff = "^0.1.7"
{%- endif %}
isort = "^5.12.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
{%- if cookiecutter.use_notebooks == 'yes' %}
jupyterlab = "^3.5"
{%- endif %}

[tool.poetry.extras]
build = ["setuptools", "cython"]

[tool.poetry.scripts]
{%- if cookiecutter.create_cli == "yes" %}
{{ cookiecutter.project_slug }} = "{{ cookiecutter.module_name }}.main:app"
{%- endif %}

[tool.isort]
{%- if cookiecutter.code_formatter == 'black' %}
profile = "black"
{%- else %}
line_length = 100
multi_line_output = 3
{%- endif %}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "test", "linter"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

{%- else %}[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_short_description }}"
authors = [{ name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" }]
requires-python = ">=3.9"
dependencies = [
{%- if cookiecutter.config_file == 'hocon' %}
"pyhocon>=0.3.59",
{%- elif cookiecutter.config_file == 'yaml' %}
"omegaconf>=2.3.0",
{%- endif %}
{%- if cookiecutter.create_cli == 'yes' %}
"typer>=0.16.1",
{%- endif %}
]

[project.license]
text = "proprietary"

[project.optional-dependencies]
build = ["setuptools", "cython"]

{%- if cookiecutter.create_cli == "yes" %}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.module_name }}.main:app"
{%- endif %}

[project.gui-scripts]
hello_gui = "{{ cookiecutter.module_name }}.gui:main"

[project.entry-points."example.plugins"]
a = "{{ cookiecutter.module_name }}_plugin_a"

[dependency-groups]
dev = ["pre-commit>=4.3.0"{% if cookiecutter.use_notebooks == 'yes' %}, "jupyterlab>=3.5"{% endif %}]
linter = [
{%- if cookiecutter.code_formatter == 'black' %}
"black>=25.1.0",
{%- else %}
"ruff>=0.1.7",
{%- endif %}
"isort>=5.12.0"
]
test = ["pytest>=8.4.1", "pytest-cov>=6.2.1"]

[tool.isort]
{%- if cookiecutter.code_formatter == 'black' %}
profile = "black"
{%- else %}
line_length = 100
multi_line_output = 3
{%- endif %}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "test", "linter"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
{%- endif %}
